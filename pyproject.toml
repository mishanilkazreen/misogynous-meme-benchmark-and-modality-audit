[project]
name = "vlm-content-moderation"
version = "0.1.0"
description = "Detection of embedded hateful content in images using vision language models"
authors = [
    {name = "Content Moderation Team"}
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "hf_xet>=1.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "hypothesis>=6.82.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "datasets>=3.1.0",
    "ultralytics>=8.4.60",
    "python-dotenv>=1.2.2",
    "open-clip-torch>=3.3.0",
    "boto3>=1.43.14",
    "accelerate>=1.13.0",
    "qwen-vl-utils>=0.0.14",
    "google-generativeai>=0.8.6",
    "bitsandbytes>=0.49.2",
    "openai>=2.41.0",
]

[project.optional-dependencies]
cloud = [
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "google-cloud-vision>=3.4.0",
]
vlm-gpu = [
    "accelerate>=0.20.0",
    "optimum>=1.13.0",
]
dev = [
    "ruff>=0.5.5",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0.0",
    "types-tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "utils"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "ARG002",  # unused method argument
    "PLC0415", # import should be at top level (allow lazy imports)
    "RUF001",  # ambiguous unicode (allow for test cases)
    "PLR0911", # too many return statements
    "RUF012",  # mutable class attributes (allow for constants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # use of assert
    "PLR2004", # magic values in tests
    "ARG001",  # unused function arguments (fixtures)
    "B011",    # assert False in tests
]
"scripts/**/*.py" = [
    "T201",    # print statements allowed in scripts
    "F841",    # unused variables in scripts
]

[tool.ruff.lint.isort]
known-first-party = ["models", "utils", "tests"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "property: marks tests as property-based tests",
]

[tool.coverage.run]
source = ["models", "utils"]
omit = [
    "tests/*",
    "scripts/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "types-pyyaml>=6.0.12.20250915",
    "types-tqdm>=4.67.0.20250809",
]
