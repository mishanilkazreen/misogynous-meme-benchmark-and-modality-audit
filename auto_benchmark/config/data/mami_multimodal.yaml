dataset:
  filepath: "data_files/mami_full.csv"
  data_type: "multimodal"
  target_column: "label"
  text_column: "text"
  image_column: "file_name"
  # Relative to the auto_benchmark working directory. Point this at (or symlink) the
  # kagglehub download, e.g. ~/.cache/kagglehub/datasets/chukwuebukaanulunko/
  # multimodal-misogyny-detection-mami-2022/versions/1/MAMI_2022_images
  image_directory: "data_files/MAMI_2022_images"
  classification_type: "binary"

preprocessing:
  text_features: "embeddings"
  embeddings_model: "all-MiniLM-L6-v2"
  image_backbone: "resnet50"
  image_size: 224
  test_size: 0.1
  random_state: 4711
