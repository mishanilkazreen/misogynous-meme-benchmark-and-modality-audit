# Smoke test image data config - 5 epochs only
dataset:
  data_type: "image"
  data_yaml_path: "data_files/coco8/coco8_data.yaml"

training:
  epochs: 5
  patience: 0
  image_size: 640
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.1
  device: "cpu"
  workers: 0

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
