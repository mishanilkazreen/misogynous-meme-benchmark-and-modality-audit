repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v4.6.0"
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.10"
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.7.1"
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
        args: [--ignore-missing-imports]
        files: ^auto_benchmark/(src/autobenchmark/|scripts/)
        exclude: ^auto_benchmark/(tests/)

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: "v8.17.3"
    hooks:
      - id: cspell

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        files: ^auto_benchmark/src/autobenchmark/
        args: ["--errors-only", "-j", "4"]
